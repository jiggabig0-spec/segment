[package]
name = "segments"
version = "0.1.0"
description = "Split a tokenized stock into fixed segment tokens and back"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "segments"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", features = ["token_2022_extensions"] }

[dev-dependencies]
solana-program-test = "=3.1.12"
solana-sdk = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
spl-token-2022-interface = "2"
spl-associated-token-account-interface = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
